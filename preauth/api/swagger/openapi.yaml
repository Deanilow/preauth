openapi: 3.0.3
info:
  title: PreAuth Orchestrator
  version: 1.0.0
  description: |
    Orquesta el flujo de pre-autenticación para canales Web y App.
    Es el único punto de entrada para la fase pre-auth. Coordina internamente:
    Anti-bot Service, Risk Engine, Token Service y Session Service.

    **Este servicio NO requiere token en sus endpoints** porque es el que genera
    el primer token del flujo (contextToken). La protección es por:
    - Rate limiting en el API Gateway (IP-based)
    - Validación de hCaptcha / Play Integrity (anti-bot)
    - Evaluación del Risk Engine (score + decisión)

    **Flujo completo post /pre-auth/context-init**:
    ```
    /pre-auth/context-init → contextToken + sessionHandle
    /onboarding/start      → sessionToken  (requiere contextToken)
    /onboarding/otp        → (requiere sessionToken + X-Request-Id)
    /onboarding/ocr        → (requiere sessionToken + X-Request-Id)
    /onboarding/face       → (requiere sessionToken + X-Request-Id)
    /onboarding/products   → (requiere sessionToken + X-Request-Id)
    ```

    > ⚠️ **Pendiente (no implementado)**: validación server-side de la atestación
    > de dispositivo nativo (Play Integrity / DeviceCheck) dentro de `captchaToken`.
    > Hoy se valida vía hCaptcha. La metadata de dispositivo se dejará anotada como
    > `TODO` y no forma parte del contrato actual.
  contact:
    name: Arquitectura Surgir

servers:
  - url: https://api.surgir.com
    description: Producción (expuesto via API Gateway)
  - url: http://localhost:3000
    description: Desarrollo local

tags:
  - name: pre-auth
    description: Endpoints del flujo pre-autenticación

paths:

  # ─── Context Init ─────────────────────────────────────────────────────────────
  /pre-auth/context-init:
    post:
      summary: Iniciar flujo de pre-auth
      description: |
        Inicia el flujo de pre-autenticación. Es el primer endpoint del ciclo de vida
        del usuario. No requiere token de autenticación.

        **Flujo interno que orquesta**:
        1. Valida el token anti-bot contra hCaptcha (web) o Play Integrity (app) server-side
        2. Evalúa el riesgo del request (IP, fingerprint, user-agent, canal, score anti-bot)
        3. Si `allow`: emite `contextToken` (TTL 120s, single-use) via Token Service
        4. Si `allow`: crea sesión de onboarding en Redis via Session Service
        5. Devuelve `contextToken` + `sessionHandle` al cliente

        **El `contextToken` es single-use**: al canjearlo en `/onboarding/start`,
        el jti queda registrado en Redis como consumido. Un segundo intento con el
        mismo token devuelve 401.
      operationId: contextInit
      tags: [pre-auth]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextInitRequest'
            examples:
              web:
                summary: Request desde canal Web
                value:
                  channel: web
                  fingerprint: a3f5b8e2d1c9f047b3a1e8d2c5f0b7a4
                  captchaToken: P1_eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
              app:
                summary: Request desde canal App (Android)
                value:
                  channel: app
                  fingerprint: b7c4d9e1f2a3b5c6d8e0f1a2b4c6d8e0
                  captchaToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Pre-auth completado. contextToken y sessionHandle listos para usar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextInitResponse'
              example:
                contextToken: eyJhbGciOiJSUzI1NiIsImtpZCI6InN1cmdpci0yMDI2MDgifQ...
                sessionHandle: 7f8a1b2c-3d4e-5f6a-7b8c-9d0e1f2a3b4c
                expiresIn: 120
        '400':
          description: Body inválido (channel, fingerprint o captchaToken faltante/inválido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: REQUEST_VALIDATION_ERROR
                  message: "channel must be 'web' or 'app'"
                  level: error
        '403':
          description: |
            Anti-bot rechazado o Risk Engine denegó el request.
            El cliente NO debe reintentar inmediatamente (puede ser detección de bot).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bot_detected:
                  summary: hCaptcha inválido
                  value:
                    error:
                      code: BOT_DETECTED
                      message: Anti-bot validation failed
                      level: error
                risk_denied:
                  summary: Risk Engine denegó
                  value:
                    error:
                      code: RISK_DENIED
                      message: Request denied
                      level: error
        '429':
          description: |
            Risk Engine requiere challenge adicional o rate limit excedido.
            El cliente puede mostrar un flujo de verificación adicional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: CHALLENGE_REQUIRED
                  message: Additional verification required
                  level: error
        '500':
          description: Error interno. Servicios dependientes no disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: CONTEXT_INIT_FAILED
                  message: Internal server error
                  level: error

  # ─── Health ──────────────────────────────────────────────────────────────────
  /health:
    get:
      summary: Health check
      operationId: health
      tags: [pre-auth]
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: preauth-orchestrator

components:

  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: |
        Generado por el API Gateway y propagado a todos los servicios internos.
        Si el cliente lo envía, el Gateway lo respeta. Si no, el Gateway lo genera.

  schemas:

    ContextInitRequest:
      type: object
      required: [channel, fingerprint, captchaToken]
      properties:
        channel:
          type: string
          enum: [web, app]
          description: Canal de origen del request
        fingerprint:
          type: string
          minLength: 32
          maxLength: 128
          description: |
            Hash SHA256 del fingerprint del dispositivo.
            Generado en el cliente (JavaScript en Web, SDK en App).
            El servidor lo usa para detección de riesgo y binding de sesión.
            NUNCA enviar el fingerprint sin hashear (privacy).
        captchaToken:
          type: string
          minLength: 10
          description: |
            Token de hCaptcha (canal web) o Play Integrity / DeviceCheck (canal app).
            Generado en el cliente resolviendo el challenge.
            El servidor valida este token contra el proveedor server-side.
            NUNCA confiar en la respuesta del cliente directamente.

    ContextInitResponse:
      type: object
      required: [contextToken, sessionHandle, expiresIn]
      properties:
        contextToken:
          type: string
          description: |
            JWT firmado RS256. TTL 120 segundos. Single-use.
            El cliente lo presenta en /onboarding/start.
            Almacenar en memoria (nunca localStorage).
        sessionHandle:
          type: string
          format: uuid
          description: |
            Identificador opaco de la sesión de onboarding en Redis.
            El cliente lo presenta como header X-Session-Handle en cada paso.
            Almacenar en memoria (nunca localStorage).
        expiresIn:
          type: integer
          description: Segundos hasta la expiración del contextToken
          example: 120

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, level]
          properties:
            code:
              type: string
              description: Código de error legible por máquina
              enum:
                - REQUEST_VALIDATION_ERROR
                - BOT_DETECTED
                - RISK_DENIED
                - CHALLENGE_REQUIRED
                - CONTEXT_INIT_FAILED
            message:
              type: string
              description: Descripción legible por humanos
            level:
              type: string
              enum: [error, warning, info]
            description:
              type: string
        correlationId:
          type: string
          format: uuid
          description: ID de correlación para soporte técnico
